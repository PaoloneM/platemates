# PlateMates. Runs unchanged on an ARM64 Mac, a Raspberry Pi or an x86 cloud VM.
#
# The generative LLM is NOT part of this stack: it is an external OpenAI-compatible service
# (Unsloth Studio on the host by default) reached through LLM_BASE_URL.
#
#   docker compose up -d db keycloak embeddings  # backing services, for native development
#   docker compose up -d                    # everything

name: platemates

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platemates}
      POSTGRES_USER: ${POSTGRES_USER:-platemates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platemates}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot, idempotent: creates Keycloak's own database on the same PostgreSQL server if it
  # does not exist yet. Runs on every `up`, so it works on fresh and existing volumes alike
  # (Postgres' own init scripts would only run on a fresh volume).
  db-init:
    image: pgvector/pgvector:pg17
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-platemates}
      PGPASSWORD: ${POSTGRES_PASSWORD:-platemates}
      PGDATABASE: ${POSTGRES_DB:-platemates}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    command:
      - sh
      - -c
      - >-
        psql -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_database WHERE datname = '$${KEYCLOAK_DB}'"
        | grep -q 1 && echo "database $${KEYCLOAK_DB} already exists"
        || (createdb "$${KEYCLOAK_DB}" && echo "created database $${KEYCLOAK_DB}")
    depends_on:
      db:
        condition: service_healthy

  # Identity provider: email/password accounts plus Google, Microsoft and Apple via brokering.
  # Django is its OIDC client; the browser sees Keycloak only for the login pages.
  keycloak:
    build: ./keycloak
    command: ["start", "--optimized"]
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-platemates}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-platemates}
      # No fixed hostname: Keycloak builds its URLs from the request, as forwarded by Traefik or the
      # Vite proxy (X-Forwarded-Proto/Host). The app works from whatever address it is opened at
      # (localhost on the Mac, the LAN name or IP from a phone), always under /auth on the app's
      # origin. TLS is terminated by Traefik; Keycloak itself speaks plain HTTP inside Docker.
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      # Direct access on the Mac only, e.g. the admin console: http://localhost:8180/auth/admin/
      - "127.0.0.1:8180:8080"
    labels:
      - traefik.enable=true
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      - traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)
      - traefik.http.routers.keycloak.entrypoints=web
      - traefik.http.routers.keycloak-tls.rule=PathPrefix(`/auth`)
      - traefik.http.routers.keycloak-tls.entrypoints=websecure
      - traefik.http.routers.keycloak-tls.tls=true
      # The admin console is not served through the app's address (use :8180 on the Mac).
      # Traefik has no "deny" middleware: an allow-list nobody matches answers 403 to all.
      - traefik.http.middlewares.deny-all.ipallowlist.sourcerange=255.255.255.255/32
      - traefik.http.routers.keycloak-admin.rule=PathPrefix(`/auth/admin`)
      - traefik.http.routers.keycloak-admin.entrypoints=web
      - traefik.http.routers.keycloak-admin.middlewares=deny-all
      - traefik.http.routers.keycloak-admin.service=keycloak
      - traefik.http.routers.keycloak-admin-tls.rule=PathPrefix(`/auth/admin`)
      - traefik.http.routers.keycloak-admin-tls.entrypoints=websecure
      - traefik.http.routers.keycloak-admin-tls.tls=true
      - traefik.http.routers.keycloak-admin-tls.middlewares=deny-all
      - traefik.http.routers.keycloak-admin-tls.service=keycloak
    healthcheck:
      # The image has no curl: speak HTTP to the management port through bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: creates or updates the realm, the Django client and the identity providers from
  # .env. Idempotent, safe to re-run after changing provider credentials.
  keycloak-setup:
    # Same image as the backend: built once, by the backend service.
    image: platemates-backend
    pull_policy: never
    command: ["python", "manage.py", "setup_keycloak"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      DATABASE_URL: postgres://${POSTGRES_USER:-platemates}:${POSTGRES_PASSWORD:-platemates}@db:5432/${POSTGRES_DB:-platemates}
    # APPLE_PRIVATE_KEY_FILE is relative to the repository root, which is / in the container.
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      keycloak:
        condition: service_healthy

  backend:
    build: ./backend
    image: platemates-backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platemates}:${POSTGRES_PASSWORD:-platemates}@db:5432/${POSTGRES_DB:-platemates}
      # Inside a container, "127.0.0.1" is the container itself: reach the host instead.
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:8888}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL_DOCKER:-http://embeddings:8100}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    labels:
      - traefik.enable=true
      - traefik.http.services.backend.loadbalancer.server.port=8000
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/oidc`) || PathPrefix(`/admin`) || PathPrefix(`/static`)"
      - traefik.http.routers.backend.entrypoints=web
      - "traefik.http.routers.backend-tls.rule=PathPrefix(`/api`) || PathPrefix(`/oidc`) || PathPrefix(`/admin`) || PathPrefix(`/static`)"
      - traefik.http.routers.backend-tls.entrypoints=websecure
      - traefik.http.routers.backend-tls.tls=true

  # Entry point: routes /api, /oidc, /admin, /static to the backend, /auth to Keycloak and the
  # rest to the SPA, from the labels on those services. Terminates HTTPS for the home network
  # with the certificate made by scripts/setup_lan_https.py (secrets/tls). Picks up containers
  # as they are created or recreated.
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # TLS certificate for the LAN, written by scripts/setup_lan_https.py.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --log.level=WARN
    ports:
      # HTTP for the Mac itself.
      - "127.0.0.1:8080:80"
      # HTTPS for the home network (a self-signed certificate until setup_lan_https.py has run).
      - "${LAN_HTTPS_PORT:-8443}:443"
    volumes:
      # Read-only, to discover containers and their labels. On a machine exposed to the
      # internet, put a socket proxy in between (see docs/operations.md).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./secrets/tls:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The built React SPA, served as static files (nginx, no proxying).
  frontend:
    build: ./frontend
    labels:
      - traefik.enable=true
      - traefik.http.services.frontend.loadbalancer.server.port=80
      # Everything else; Traefik tries longer (more specific) rules first.
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend-tls.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend-tls.entrypoints=websecure
      - traefik.http.routers.frontend-tls.tls=true

  # Local multilingual embedding model (recipe similarity, "help me search"). Part of the default
  # stack since the search mode needs it; the backend degrades gracefully when it is down.
  embeddings:
    build: ./services/embeddings
    environment:
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      # Healthy once the model is loaded (the first start downloads it): /ready embeds a word.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=60)"]
      interval: 15s
      timeout: 70s
      retries: 20
      start_period: 30s

  # One-shot, idempotent: embeds recipes whose vector is missing or stale (e.g. saved while the
  # embedding service was down, or after changing EMBEDDINGS_MODEL). Runs on every `up`.
  embed-recipes:
    image: platemates-backend
    pull_policy: never
    command: ["python", "manage.py", "embed_recipes"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platemates}:${POSTGRES_PASSWORD:-platemates}@db:5432/${POSTGRES_DB:-platemates}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL_DOCKER:-http://embeddings:8100}
    depends_on:
      embeddings:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
