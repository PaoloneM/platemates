# The public server. Personal values (emails) are in vault.yml, encrypted with ansible-vault:
# the repository is public.

platemates_domain: platemates.cloud
platemates_url: "https://{{ platemates_domain }}"
# Cloudflare in front of everything (deploy/roles/cloudflare, docs/operations.md), step by step:
# enabled once the zone is active; hosts moved into the tunnel one at a time; the public ports
# closed last. Each step is a deploy, and each can be undone by one.
cloudflare_enabled: true
cloudflare_tunnel_hosts:
  - "{{ platemates_admin_domain }}"
  - "{{ platemates_domain }}"
  - "www.{{ platemates_domain }}"
platemates_public_ports_open: false

# The admin plane (apps/core/planes.py), on the VM's 127.0.0.1:9443 only: through Cloudflare's
# tunnel behind Access once the admin host is in it, and always through an SSH tunnel (the way
# in when Cloudflare is not).
platemates_admin_domain: "admin.{{ platemates_domain }}"
platemates_admin_tunnel_url: "https://{{ platemates_admin_domain }}:9443"
platemates_admin_url: >-
  {{ 'https://' ~ platemates_admin_domain if platemates_admin_domain in cloudflare_tunnel_hosts
     else platemates_admin_tunnel_url }}
platemates_dir: /opt/platemates
platemates_repo: https://github.com/PaoloneM/platemates.git
# Git ref checked out for the compose files and scripts.
platemates_git_ref: main
# Images built by GitHub Actions (.github/workflows/images.yml): `latest` follows main; pin a
# build with `-e platemates_version=sha-<commit>`.
platemates_image_prefix: ghcr.io/paolonem/platemates
platemates_version: latest

# Claude answers, OpenAI embeds: no model runs on the server (docs/architecture.md).
platemates_llm_provider: anthropic
platemates_embeddings_provider: openai

platemates_acme_email: "{{ vault_acme_email }}"

# Outgoing email (password reset, email verification): Brevo's SMTP relay on port 587 (Hetzner
# blocks 25 and 465). Switched on once Brevo has verified the domain (its DNS records below);
# setup_keycloak then turns reset and verification on in the realm.
platemates_email_enabled: false
platemates_smtp_host: smtp-relay.brevo.com
platemates_smtp_from: "no-reply@{{ platemates_domain }}"
# Records that let other mail servers trust what Brevo sends for the domain (written by
# deploy/roles/cloudflare). SPF is one record for every sender: ImprovMX (incoming mail
# forwarding) and Brevo together.
cloudflare_mail_records:
  - { type: TXT, name: "{{ platemates_domain }}", content: "v=spf1 include:spf.improvmx.com include:spf.brevo.com ~all" }
  - { type: TXT, name: "_dmarc.{{ platemates_domain }}", content: "v=DMARC1; p=none" }
platemates_app_admins: "{{ vault_app_admins }}"

# Written into the server's .env on every run (the rest of it, secrets included, is created
# once by scripts/init_env.py on the server and never overwritten).
platemates_env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.prod.yml
  PLATEMATES_DOMAIN: "{{ platemates_domain }}"
  PLATEMATES_IMAGE_PREFIX: "{{ platemates_image_prefix }}"
  PLATEMATES_VERSION: "{{ platemates_version }}"
  ACME_EMAIL: "{{ platemates_acme_email }}"
  DJANGO_DEBUG: "false"
  DJANGO_SECURE_COOKIES: "true"
  DJANGO_ALLOWED_HOSTS: "{{ platemates_domain }},{{ platemates_admin_domain }}"
  DJANGO_CSRF_TRUSTED_ORIGINS: "{{ platemates_url }},https://{{ platemates_admin_domain }},{{ platemates_admin_tunnel_url }}"
  APP_PUBLIC_URLS: "{{ platemates_url }},https://{{ platemates_admin_domain }},{{ platemates_admin_tunnel_url }}"
  # A request without the plane header (one that did not come through Traefik) gets no powers.
  DEFAULT_PLANE: public
  PLATEMATES_ADMIN_DOMAIN: "{{ platemates_admin_domain }}"
  PLATEMATES_ADMIN_URL: "{{ platemates_admin_url }}"
  # Grafana, on the admin plane (its Keycloak client's redirect target).
  GRAFANA_URLS: "{{ platemates_admin_url }}/grafana"

  # Certificates: Let's Encrypt through a DNS challenge on Cloudflare (a token that edits this
  # zone's DNS only), for both Traefiks; the public ports need not be open for it.
  CF_DNS_API_TOKEN: "{{ vault_cloudflare_dns_token | default('') }}"
  # cloudflared runs with the `cloudflare` profile, once the role gave it its token.
  COMPOSE_PROFILES: "{{ 'cloudflare' if cloudflare_enabled | bool else '' }}"
  # Where Traefik's public ports listen: everywhere, or only on the VM itself once the traffic
  # comes through the tunnel.
  PLATEMATES_PUBLIC_BIND: "{{ '0.0.0.0' if platemates_public_ports_open | bool else '127.0.0.1' }}"
  APP_ADMINS: "{{ platemates_app_admins }}"
  LLM_PROVIDER: "{{ platemates_llm_provider }}"
  EMBEDDINGS_PROVIDER: "{{ platemates_embeddings_provider }}"
  ANTHROPIC_API_KEY: "{{ vault_anthropic_api_key }}"
  OPENAI_API_KEY: "{{ vault_openai_api_key }}"
  # Social login: a provider appears on the login page once its credentials are in the vault
  # (keycloak-setup applies them on every deploy). docs/authentication.md has the steps.
  GOOGLE_CLIENT_ID: "{{ vault_google_client_id | default('') }}"
  GOOGLE_CLIENT_SECRET: "{{ vault_google_client_secret | default('') }}"
  # Outgoing email (setup_keycloak): empty host while it is off.
  SMTP_HOST: "{{ platemates_smtp_host if platemates_email_enabled | bool else '' }}"
  SMTP_PORT: "587"
  SMTP_STARTTLS: "true"
  SMTP_FROM: "{{ platemates_smtp_from }}"
  SMTP_USER: "{{ vault_smtp_user | default('') }}"
  SMTP_PASSWORD: "{{ vault_smtp_password | default('') }}"
  # The backups' encryption passphrase (pgBackRest repository, the .env copy).
  PGBACKREST_CIPHER_PASS: "{{ vault_pgbackrest_cipher_pass }}"

# Backups (deploy/roles/backup): where they are, and the SSH keys that may copy them (the home
# NAS, read-only through rrsync). Public keys, so not in the vault.
backup_dir: /var/backups/platemates
backup_pull_keys:
  # The home FreeNAS (192.168.0.3), its `platemates` user's rsync task (2026-10-10). Copies into
  # ~/server, never the home itself: --delete would empty it, keys included.
  # RSA: FreeNAS 11.3 cannot validate an ed25519 key when saving an rsync task.
  - ssh-rsa  platemates@freenas.local

base_timezone: Europe/Rome
base_swap_mb: 2048
