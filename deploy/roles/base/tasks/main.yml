# The server as a whole: up to date, keys-only SSH, a firewall, swap. Idempotent.

- name: Install updates
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"

- name: Apply security updates automatically
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Set the time zone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Accept SSH keys only
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-platemates.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ban addresses that keep failing SSH logins
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# Docker publishes its ports around ufw: only Traefik's 80 and 443 are published
# (docker-compose.prod.yml, and only on 127.0.0.1 once the traffic comes through Cloudflare's
# tunnel), so this covers what the host itself listens on.
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP and HTTPS while the public ports are open
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    delete: "{{ not (platemates_public_ports_open | bool) }}"
  loop: ["80", "443"]

- name: Deny everything else coming in
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Create the swap file
  ansible.builtin.command: >-
    sh -c 'fallocate -l {{ base_swap_mb }}M /swapfile && chmod 600 /swapfile && mkswap /swapfile'
  args:
    creates: /swapfile
  when: base_swap_mb | int > 0

- name: Use the swap file, also after a reboot
  ansible.posix.mount:
    src: /swapfile
    path: none
    fstype: swap
    opts: sw
    state: present
  when: base_swap_mb | int > 0

- name: Turn the swap on
  ansible.builtin.command: swapon /swapfile
  register: swapon
  changed_when: swapon.rc == 0
  failed_when: swapon.rc != 0 and 'busy' not in swapon.stderr
  when: base_swap_mb | int > 0

- name: Swap only under pressure
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/90-platemates.conf
