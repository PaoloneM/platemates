# Host-side metrics node-exporter cannot see: each container's CPU and memory, from cgroups.
# The rest of the monitoring runs in Docker (docker-compose.prod.yml).

- name: Create the folder for the server's own configuration files
  ansible.builtin.file:
    path: /etc/platemates
    state: directory
    mode: "0755"

- name: Create the folder for textfile metrics
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    mode: "0755"

# Grafana's Telegram contact point (alert rules: monitoring/grafana/make_alerts.py). A file rather
# than environment variables: Grafana turns a numeric chat id from a variable into a number its
# Telegram integration refuses. Readable by root and by Grafana's group (0) only.
- name: Write Grafana's Telegram contact point
  ansible.builtin.template:
    src: grafana-contactpoints.yaml.j2
    dest: /etc/platemates/grafana-contactpoints.yaml
    mode: "0640"
  notify: Restart Grafana

- name: Keep the Telegram credentials out of .env
  ansible.builtin.lineinfile:
    path: "{{ platemates_dir }}/.env"
    regexp: "^TELEGRAM_(BOT_TOKEN|CHAT_ID)="
    state: absent
  failed_when: false

- name: Install the container metrics script
  ansible.builtin.template:
    src: platemates-container-metrics.sh.j2
    dest: /usr/local/sbin/platemates-container-metrics
    mode: "0755"

- name: Install its service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [platemates-container-metrics.service, platemates-container-metrics.timer]
  notify: Reload systemd

- name: Load the units now
  ansible.builtin.meta: flush_handlers

- name: Collect container metrics every 30 seconds
  ansible.builtin.systemd_service:
    name: platemates-container-metrics.timer
    enabled: true
    state: started
