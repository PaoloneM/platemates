# The application: the repository's compose files and scripts, a .env, the published images.
# Idempotent: re-running with nothing changed changes nothing; with a new version, it pulls and
# recreates only what changed.

# A file mounted into a container that is missing from the checkout makes Docker create an
# empty directory in its place, which then blocks the checkout from bringing the file
# (happened with monitoring/db-roles.sql, kept out by .gitignore). Only empty directories go.
- name: Remove empty directories Docker made in place of mounted files
  ansible.builtin.command: >-
    find {{ platemates_dir }}/monitoring {{ platemates_dir }}/traefik-admin
    -maxdepth 1 -type d -empty -name '*.*' -print -delete
  register: stray
  changed_when: stray.stdout != ""
  failed_when: false

- name: Check out the repository
  ansible.builtin.git:
    repo: "{{ platemates_repo }}"
    dest: "{{ platemates_dir }}"
    version: "{{ platemates_git_ref }}"
  register: checkout

- name: Keep secrets readable by root only
  ansible.builtin.file:
    path: "{{ platemates_dir }}/secrets"
    state: directory
    mode: "0700"

# Creates .env from .env.example on the first run and generates its secrets (Django key,
# Keycloak passwords); later runs only add keys new to .env.example. Never changes a value.
- name: Create or complete .env
  ansible.builtin.command: python3 scripts/init_env.py
  args:
    chdir: "{{ platemates_dir }}"
  register: init_env
  changed_when: "'nothing changed' not in init_env.stdout"

# Only when .env was just created: the database volume is created with this password on the
# first start, and changing it afterwards would lock the app out of its own data.
- name: Give the database a random password on the first deploy
  ansible.builtin.lineinfile:
    path: "{{ platemates_dir }}/.env"
    regexp: "^POSTGRES_PASSWORD="
    line: "POSTGRES_PASSWORD={{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
    mode: "0600"
  when: "'created .env' in init_env.stdout"

- name: Set the server's own values in .env
  ansible.builtin.lineinfile:
    path: "{{ platemates_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    mode: "0600"
  loop: "{{ platemates_env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  # Some values are API keys: never print them, not even with --diff.
  diff: false

- name: Pull the images and start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ platemates_dir }}"
    # `latest` moves with every build of main: always look for a newer one.
    pull: always
    remove_orphans: true
    state: present
  register: compose

# Services that read mounted configuration files only when they start: restarted when the
# checkout changed those files (compose does not notice a mounted file's content changing).
- name: Find what the checkout changed
  ansible.builtin.command:
    cmd: git diff --name-only {{ checkout.before }} {{ checkout.after }}
    chdir: "{{ platemates_dir }}"
  register: changed_files
  changed_when: false
  when: checkout.changed and checkout.before is truthy

- name: Restart services whose configuration files changed
  ansible.builtin.command:
    cmd: docker compose restart {{ item.service }}
    chdir: "{{ platemates_dir }}"
  loop:
    - { path: monitoring/grafana/, service: grafana }
    - { path: monitoring/scrape.yml, service: victoriametrics }
    - { path: traefik-admin/, service: traefik-admin }
  loop_control:
    label: "{{ item.service }}"
  when: changed_files.stdout is defined and item.path in changed_files.stdout

- name: Wait for the backend behind Traefik
  ansible.builtin.uri:
    url: https://127.0.0.1/api/health/
    headers:
      Host: "{{ platemates_domain }}"
    # Until the domain points here, Traefik has no Let's Encrypt certificate yet.
    validate_certs: false
  register: health
  until: health.status == 200 and health.json.database.ok
  retries: 30
  delay: 5
  changed_when: false
