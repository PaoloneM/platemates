# Run through scripts/deploy.sh, which mounts this folder at /ansible in the
# authkeys/docker-ansible container.
[defaults]
inventory = inventory.yml
# Galaxy roles (requirements.yml) install into the first path: inside the container, not here.
roles_path = ~/.ansible/roles:roles
vault_password_file = /vault-password
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = false

[ssh_connection]
# The host key is pinned in known_hosts (in the repository): a changed key stops the run.
# The user's own ssh config is not read (it has macOS-only options); keys come from the Mac's
# ssh-agent, forwarded into the container.
ssh_args = -F /dev/null -o UserKnownHostsFile=/ansible/known_hosts -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
