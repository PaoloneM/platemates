# pgBackRest for PlateMates. The repository is a host folder (docker-compose.prod.yml) that the
# home NAS copies with rsync; its passphrase and the database user come from the environment
# (PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_PG1_USER).

[global]
repo1-path=/var/lib/pgbackrest
# Encrypted: the copies outside the server are unreadable without the passphrase (in the vault).
repo1-cipher-type=aes-256-cbc
# Two full backups (weekly) and the WAL between them: about two weeks to restore to any moment.
repo1-retention-full=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=off
spool-path=/var/spool/pgbackrest

[platemates]
pg1-path=/var/lib/postgresql/data
