# PlateMates on a public server (platemates.cloud), on top of docker-compose.yml:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml   (set in the server's .env)
#   docker compose pull && docker compose up -d
#
# What changes from the base file:
# - images come from the registry (GitHub Actions builds them, .github/workflows/images.yml),
#   at PLATEMATES_VERSION; nothing is built on the server;
# - Traefik listens on 80 and 443, gets a Let's Encrypt certificate for PLATEMATES_DOMAIN and
#   sends plain HTTP to HTTPS;
# - Traefik reads the Docker API through a socket proxy that only lists containers, never the
#   socket itself (docs/operations.md);
# - no other port is published: the database, Redis, Keycloak and the backend are reachable only
#   inside Docker;
# - two planes (apps/core/planes.py): the public Traefik serves the app only, and tells the
#   backend so (X-PlateMates-Plane: public); a second Traefik, `traefik-admin`, listens only on
#   the VM's 127.0.0.1:9443, reached through an SSH tunnel, and serves Gestione, Django admin and
#   Keycloak's console (traefik-admin/dynamic.yml).
#
# Needs Docker Compose 2.24+ (`!reset`, `!override`).

x-backend-image: &backend-image
  image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-backend:${PLATEMATES_VERSION:-latest}
  pull_policy: missing

services:
  # Long-running services come back after a reboot; one-shots (db-init, keycloak-setup,
  # embed-recipes) run once per `up`.
  #
  # The database archives its WAL continuously into pgBackRest's encrypted repository, a host
  # folder the home NAS copies with rsync (deploy/roles/backup, docs/operations.md): backups
  # every night, restore to any moment of the last two weeks. archive_timeout closes a WAL
  # segment at least every 5 minutes, so even a quiet database is never further behind.
  db:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-db:${PLATEMATES_VERSION:-latest}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=platemates archive-push %p
      - -c
      - archive_timeout=300
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS in .env}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-platemates}
    volumes:
      - /var/backups/platemates/pgbackrest:/var/lib/pgbackrest
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  keycloak:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-keycloak:${PLATEMATES_VERSION:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    labels:
      # Besides the admin console (denied in the base file), the master realm: its login page
      # is Keycloak's own administrators', and has no business on the internet. Both are on the
      # admin plane.
      - traefik.http.routers.keycloak-master-tls.rule=PathPrefix(`/auth/realms/master`)
      - traefik.http.routers.keycloak-master-tls.entrypoints=websecure
      - traefik.http.routers.keycloak-master-tls.tls=true
      - traefik.http.routers.keycloak-master-tls.middlewares=deny-all
      - traefik.http.routers.keycloak-master-tls.service=keycloak

  keycloak-setup:
    <<: *backend-image

  backend:
    <<: *backend-image
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    labels:
      # The public plane: the app's API and login only. Django admin and the admin-only APIs are
      # not routed here (and the backend answers 404 for them on this plane anyway).
      - traefik.http.middlewares.plane-public.headers.customrequestheaders.X-PlateMates-Plane=public
      - "traefik.http.routers.backend-tls.rule=(PathPrefix(`/api`) && !PathPrefix(`/api/config`) && !PathPrefix(`/api/cache`) && !PathPrefix(`/api/usage`) && !PathPrefix(`/api/search-probe`) && !PathPrefix(`/api/audit-stats`) && !PathPrefix(`/api/invite-requests`) && !PathPrefix(`/api/transfer`) && !PathPrefix(`/api/system-drafts`)) || PathPrefix(`/oidc`) || PathPrefix(`/static`)"
      - traefik.http.routers.backend-tls.middlewares=plane-public

  realtime:
    <<: *backend-image
    ports: !reset []
    restart: unless-stopped
    labels:
      - traefik.http.routers.realtime-tls.middlewares=plane-public

  worker:
    <<: *backend-image
    restart: unless-stopped

  embed-recipes:
    <<: *backend-image
    depends_on: !override
      db:
        condition: service_healthy

  frontend:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-frontend:${PLATEMATES_VERSION:-latest}
    build: !reset null
    restart: unless-stopped
    labels:
      # Gestione is on the admin plane only; and paths the backend's router leaves out (Django
      # admin, admin-only APIs) must not fall through to the SPA: they get Traefik's 404.
      - traefik.http.routers.frontend-tls.rule=PathPrefix(`/`) && !PathPrefix(`/manage`) && !PathPrefix(`/api`) && !PathPrefix(`/admin`) && !PathPrefix(`/oidc`)
      # Traefik ranks routers by rule length: this one is now longer than /auth's and
      # /websocket's, so it must be told it comes last.
      - traefik.http.routers.frontend-tls.priority=1
      # The base file's routers set `tls=true` themselves, so Traefik ignores the entry point's
      # TLS defaults (resolver included): one router asks Let's Encrypt for the domain, and every
      # router serves the certificate from Traefik's store, the domain being the same.
      - traefik.http.routers.frontend-tls.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend-tls.tls.domains[0].main=${PLATEMATES_DOMAIN:?set PLATEMATES_DOMAIN in .env}

  # Embeddings come from OpenAI's API on the server (EMBEDDINGS_PROVIDER=openai): the local
  # model would take a gigabyte of the 4 GB. Started only with `--profile local-embeddings`
  # (then set EMBEDDINGS_PROVIDER=openai_compatible).
  embeddings:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-embeddings:${PLATEMATES_VERSION:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    profiles: [local-embeddings]

  # The Docker API, read-only and reduced to what Traefik needs: listing containers and
  # following their events. Traefik never sees the socket itself.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  traefik:
    command: !override
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # A DNS challenge on Cloudflare: it needs no open port (the traffic may all come through
      # the tunnel).
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --ping=true
      - --log.level=WARN
      # Metrics for VictoriaMetrics, on an entry point that is not published.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN in .env}
    # On every address while the public ports are open; on the VM's own once Cloudflare's
    # tunnel brings the traffic (PLATEMATES_PUBLIC_BIND, deploy/group_vars).
    ports: !override
      - "${PLATEMATES_PUBLIC_BIND:-0.0.0.0}:80:80"
      - "${PLATEMATES_PUBLIC_BIND:-0.0.0.0}:443:443"
    volumes: !override
      - letsencrypt:/letsencrypt
    depends_on:
      - socket-proxy
    restart: unless-stopped

  # The admin plane: only on the VM's loopback, reached through Cloudflare's tunnel (behind
  # Access) or an SSH tunnel (`ssh platemates01` forwards 9443). Routes from a file, no Docker
  # access; its certificate from Let's Encrypt through a DNS challenge on Cloudflare.
  traefik-admin:
    image: traefik:v3.7
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.admin.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --ping=true
      - --log.level=WARN
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN in .env}
      PLATEMATES_ADMIN_DOMAIN: ${PLATEMATES_ADMIN_DOMAIN:?set PLATEMATES_ADMIN_DOMAIN in .env}
    ports:
      - "127.0.0.1:9443:443"
    volumes:
      - ./traefik-admin/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt-admin:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cloudflare's tunnel (deploy/roles/cloudflare): an outbound connection that brings the
  # traffic of the hosts routed through it to the two Traefiks, so the server needs no open
  # port. Started only with the `cloudflare` profile, once the deploy gave it its token.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    profiles: [cloudflare]
    depends_on:
      - traefik
      - traefik-admin
    restart: unless-stopped

  # -- Monitoring (admin plane only): docs/operations.md -------------------------------------

  # Metrics store, 30 days; scrapes the exporters below (monitoring/scrape.yml).
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -promscrape.config=/etc/vm/scrape.yml
      # Re-read the scrape configuration when it changes, without a restart.
      - -promscrape.configCheckInterval=1m
    volumes:
      - victoriametrics:/storage
      - ./monitoring/scrape.yml:/etc/vm/scrape.yml:ro
    restart: unless-stopped

  # The VM itself, read from the host's filesystem; plus textfile metrics written on the host:
  # the backups' outcome and each container's CPU and memory (deploy/roles/backup, monitoring).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile:/textfile:ro
    restart: unless-stopped

  # PostgreSQL's statistics, as the read-only `monitoring` role (pg_monitor, no table data).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-platemates}?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD:?set MONITORING_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # One-shot, on every `up`: the read-only roles above and Grafana's (monitoring/db-roles.sql),
  # once the backend has created the tables. Idempotent; passwords follow .env.
  db-roles:
    image: pgvector/pgvector:pg17
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-platemates}
      PGPASSWORD: ${POSTGRES_PASSWORD:-platemates}
      PGDATABASE: ${POSTGRES_DB:-platemates}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:?set MONITORING_DB_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        until psql -tAc "SELECT to_regclass('public.usage_aiusage'), to_regclass('public.accounts_inviterequest')" | grep -q 'usage_aiusage|accounts_inviterequest';
        do sleep 3; done;
        psql -v ON_ERROR_STOP=1 -v dbname="$$PGDATABASE"
        -v grafana_password="$$GRAFANA_DB_PASSWORD" -v monitoring_password="$$MONITORING_DB_PASSWORD"
        -f /sql/db-roles.sql
    volumes:
      - ./monitoring/db-roles.sql:/sql/db-roles.sql:ro
    depends_on:
      db:
        condition: service_healthy

  # Dashboards (monitoring/grafana), at /grafana on the admin plane, embedded in the app's
  # Monitoring page. Signs in through Keycloak (client platemates-grafana, setup_keycloak):
  # administrators only; silently, with the Keycloak session of the app, so it works inside an
  # iframe (Google itself cannot be framed).
  grafana:
    image: grafana/grafana-oss:12.4.3
    environment:
      GF_SERVER_ROOT_URL: ${PLATEMATES_ADMIN_URL:?set PLATEMATES_ADMIN_URL in .env}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: platemates-grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?set GRAFANA_OIDC_CLIENT_SECRET in .env}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      # The browser goes to Keycloak on the admin host; Grafana talks to it inside Docker.
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${PLATEMATES_ADMIN_URL}/auth/realms/${KEYCLOAK_REALM:-platemates}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-platemates}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-platemates}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # Keycloak's `admin` realm role (the app's administrators) is Grafana's Admin; anyone else
      # is refused.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${PLATEMATES_ADMIN_URL}/
      # For the PostgreSQL datasource (monitoring/grafana/provisioning).
      POSTGRES_DB: ${POSTGRES_DB:-platemates}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Alerts: the rules from the repository, the Telegram contact point written by Ansible
      # (deploy/roles/monitoring: it holds the bot token, and a chat id Grafana must read as text).
      - ./monitoring/grafana/provisioning/alerting/alerts.json:/etc/grafana/provisioning/alerting/alerts.json:ro
      - /etc/platemates/grafana-contactpoints.yaml:/etc/grafana/provisioning/alerting/contactpoints.yaml:ro
    depends_on:
      - victoriametrics
    restart: unless-stopped

volumes:
  victoriametrics:
  grafana:
  letsencrypt-admin:
  # The certificates and the ACME account: kept across restarts, so Let's Encrypt's rate limits
  # are never at risk.
  letsencrypt:
