# PlateMates on a public server (platemates.cloud), on top of docker-compose.yml:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml   (set in the server's .env)
#   docker compose pull && docker compose up -d
#
# What changes from the base file:
# - images come from the registry (GitHub Actions builds them, .github/workflows/images.yml),
#   at PLATEMATES_VERSION; nothing is built on the server;
# - Traefik listens on 80 and 443, gets a Let's Encrypt certificate for PLATEMATES_DOMAIN and
#   sends plain HTTP to HTTPS;
# - Traefik reads the Docker API through a socket proxy that only lists containers, never the
#   socket itself (docs/operations.md);
# - no other port is published: the database, Redis, Keycloak and the backend are reachable only
#   inside Docker;
# - two planes (apps/core/planes.py): the public Traefik serves the app only, and tells the
#   backend so (X-PlateMates-Plane: public); a second Traefik, `traefik-admin`, listens only on
#   the VM's 127.0.0.1:9443, reached through an SSH tunnel, and serves Gestione, Django admin and
#   Keycloak's console (traefik-admin/dynamic.yml).
#
# Needs Docker Compose 2.24+ (`!reset`, `!override`).

x-backend-image: &backend-image
  image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-backend:${PLATEMATES_VERSION:-latest}
  pull_policy: missing

services:
  # Long-running services come back after a reboot; one-shots (db-init, keycloak-setup,
  # embed-recipes) run once per `up`.
  #
  # The database archives its WAL continuously into pgBackRest's encrypted repository, a host
  # folder the home NAS copies with rsync (deploy/roles/backup, docs/operations.md): backups
  # every night, restore to any moment of the last two weeks. archive_timeout closes a WAL
  # segment at least every 5 minutes, so even a quiet database is never further behind.
  db:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-db:${PLATEMATES_VERSION:-latest}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=platemates archive-push %p
      - -c
      - archive_timeout=300
    environment:
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS in .env}
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-platemates}
    volumes:
      - /var/backups/platemates/pgbackrest:/var/lib/pgbackrest
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  keycloak:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-keycloak:${PLATEMATES_VERSION:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    labels:
      # Besides the admin console (denied in the base file), the master realm: its login page
      # is Keycloak's own administrators', and has no business on the internet. Both are on the
      # admin plane.
      - traefik.http.routers.keycloak-master-tls.rule=PathPrefix(`/auth/realms/master`)
      - traefik.http.routers.keycloak-master-tls.entrypoints=websecure
      - traefik.http.routers.keycloak-master-tls.tls=true
      - traefik.http.routers.keycloak-master-tls.middlewares=deny-all
      - traefik.http.routers.keycloak-master-tls.service=keycloak

  keycloak-setup:
    <<: *backend-image

  backend:
    <<: *backend-image
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    labels:
      # The public plane: the app's API and login only. Django admin and the admin-only APIs are
      # not routed here (and the backend answers 404 for them on this plane anyway).
      - traefik.http.middlewares.plane-public.headers.customrequestheaders.X-PlateMates-Plane=public
      - "traefik.http.routers.backend-tls.rule=(PathPrefix(`/api`) && !PathPrefix(`/api/config`) && !PathPrefix(`/api/cache`) && !PathPrefix(`/api/usage`) && !PathPrefix(`/api/transfer`) && !PathPrefix(`/api/system-drafts`)) || PathPrefix(`/oidc`) || PathPrefix(`/static`)"
      - traefik.http.routers.backend-tls.middlewares=plane-public

  realtime:
    <<: *backend-image
    ports: !reset []
    restart: unless-stopped
    labels:
      - traefik.http.routers.realtime-tls.middlewares=plane-public

  worker:
    <<: *backend-image
    restart: unless-stopped

  embed-recipes:
    <<: *backend-image
    depends_on: !override
      db:
        condition: service_healthy

  frontend:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-frontend:${PLATEMATES_VERSION:-latest}
    build: !reset null
    restart: unless-stopped
    labels:
      # Gestione is on the admin plane only; and paths the backend's router leaves out (Django
      # admin, admin-only APIs) must not fall through to the SPA: they get Traefik's 404.
      - traefik.http.routers.frontend-tls.rule=PathPrefix(`/`) && !PathPrefix(`/manage`) && !PathPrefix(`/api`) && !PathPrefix(`/admin`) && !PathPrefix(`/oidc`)
      # Traefik ranks routers by rule length: this one is now longer than /auth's and
      # /websocket's, so it must be told it comes last.
      - traefik.http.routers.frontend-tls.priority=1
      # The base file's routers set `tls=true` themselves, so Traefik ignores the entry point's
      # TLS defaults (resolver included): one router asks Let's Encrypt for the domain, and every
      # router serves the certificate from Traefik's store, the domain being the same.
      - traefik.http.routers.frontend-tls.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend-tls.tls.domains[0].main=${PLATEMATES_DOMAIN:?set PLATEMATES_DOMAIN in .env}

  # Embeddings come from OpenAI's API on the server (EMBEDDINGS_PROVIDER=openai): the local
  # model would take a gigabyte of the 4 GB. Started only with `--profile local-embeddings`
  # (then set EMBEDDINGS_PROVIDER=openai_compatible).
  embeddings:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-embeddings:${PLATEMATES_VERSION:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    profiles: [local-embeddings]

  # The Docker API, read-only and reduced to what Traefik needs: listing containers and
  # following their events. Traefik never sees the socket itself.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  traefik:
    command: !override
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --log.level=WARN
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - letsencrypt:/letsencrypt
    depends_on:
      - socket-proxy
    restart: unless-stopped

  # The admin plane: only on the VM's loopback, reached through an SSH tunnel
  # (`ssh platemates01` forwards 9443). Routes from a file, no Docker access; its certificate
  # comes from Let's Encrypt through a DNS challenge on Hostinger's API, since the name resolves
  # to 127.0.0.1 and no HTTP challenge can reach it.
  traefik-admin:
    image: traefik:v3.7
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.admin.address=:443
      - --certificatesresolvers.hostinger.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.hostinger.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.hostinger.acme.dnschallenge.provider=hostinger
      - --ping=true
      - --log.level=WARN
    environment:
      HOSTINGER_API_TOKEN: ${HOSTINGER_API_TOKEN:?set HOSTINGER_API_TOKEN in .env}
      PLATEMATES_ADMIN_DOMAIN: ${PLATEMATES_ADMIN_DOMAIN:?set PLATEMATES_ADMIN_DOMAIN in .env}
    ports:
      - "127.0.0.1:9443:443"
    volumes:
      - ./traefik-admin/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt-admin:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  letsencrypt-admin:
  # The certificates and the ACME account: kept across restarts, so Let's Encrypt's rate limits
  # are never at risk.
  letsencrypt:
