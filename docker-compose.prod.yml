# PlateMates on a public server (platemates.cloud), on top of docker-compose.yml:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml   (set in the server's .env)
#   docker compose pull && docker compose up -d
#
# What changes from the base file:
# - images come from the registry (GitHub Actions builds them, .github/workflows/images.yml),
#   at PLATEMATES_VERSION; nothing is built on the server;
# - Traefik listens on 80 and 443, gets a Let's Encrypt certificate for PLATEMATES_DOMAIN and
#   sends plain HTTP to HTTPS;
# - Traefik reads the Docker API through a socket proxy that only lists containers, never the
#   socket itself (docs/operations.md);
# - no other port is published: the database, Redis, Keycloak and the backend are reachable only
#   inside Docker.
#
# Needs Docker Compose 2.24+ (`!reset`, `!override`).

x-backend-image: &backend-image
  image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-backend:${PLATEMATES_VERSION:-latest}
  pull_policy: missing

services:
  # Long-running services come back after a reboot; one-shots (db-init, keycloak-setup,
  # embed-recipes) run once per `up`.
  db:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  keycloak:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-keycloak:${PLATEMATES_VERSION:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped

  keycloak-setup:
    <<: *backend-image

  backend:
    <<: *backend-image
    build: !reset null
    ports: !reset []
    restart: unless-stopped

  realtime:
    <<: *backend-image
    ports: !reset []
    restart: unless-stopped

  worker:
    <<: *backend-image
    restart: unless-stopped

  embed-recipes:
    <<: *backend-image
    depends_on: !override
      db:
        condition: service_healthy

  frontend:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-frontend:${PLATEMATES_VERSION:-latest}
    build: !reset null
    restart: unless-stopped
    labels:
      # The base file's routers set `tls=true` themselves, so Traefik ignores the entry point's
      # TLS defaults (resolver included): one router asks Let's Encrypt for the domain, and every
      # router serves the certificate from Traefik's store, the domain being the same.
      - traefik.http.routers.frontend-tls.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend-tls.tls.domains[0].main=${PLATEMATES_DOMAIN:?set PLATEMATES_DOMAIN in .env}

  # Embeddings come from OpenAI's API on the server (EMBEDDINGS_PROVIDER=openai): the local
  # model would take a gigabyte of the 4 GB. Started only with `--profile local-embeddings`
  # (then set EMBEDDINGS_PROVIDER=openai_compatible).
  embeddings:
    image: ${PLATEMATES_IMAGE_PREFIX:-ghcr.io/paolonem/platemates}-embeddings:${PLATEMATES_VERSION:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    profiles: [local-embeddings]

  # The Docker API, read-only and reduced to what Traefik needs: listing containers and
  # following their events. Traefik never sees the socket itself.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  traefik:
    command: !override
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --log.level=WARN
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - letsencrypt:/letsencrypt
    depends_on:
      - socket-proxy
    restart: unless-stopped

volumes:
  # The certificates and the ACME account: kept across restarts, so Let's Encrypt's rate limits
  # are never at risk.
  letsencrypt:
