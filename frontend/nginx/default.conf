# Serves the built SPA, nothing else: routing, the API, Keycloak and HTTPS are Traefik's job
# (docker-compose.yml).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route of the SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
