# Plain HTTP, published on the Mac only (127.0.0.1:8080).
server {
    listen 80;
    include /etc/nginx/snippets/mymenu-app.conf;
}

# HTTPS for other devices on the home network (port 8443), present only once
# `scripts/setup_lan_https.py` has created a certificate and `tls/https.conf`. Without them this
# include matches nothing and nginx serves HTTP only.
include /etc/nginx/tls/*.conf;
