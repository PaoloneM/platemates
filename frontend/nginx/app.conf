# Everything the app serves, shared by the HTTP and HTTPS servers. One origin for the SPA, the
# Django API and Keycloak's login pages, so session cookies, CSRF and OIDC redirects all work
# from any address the app is opened at.

root /usr/share/nginx/html;

# Resolve upstreams through Docker's DNS on every request: with a static `proxy_pass` host,
# nginx keeps the IP from its start and breaks whenever a container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:8000;
set $keycloak http://keycloak:8080;

proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location ~ ^/(api|oidc|admin|static)/ {
    proxy_pass $backend;
    # Assistant turns wait on the LLM.
    proxy_read_timeout 300s;
    # Recipe photos (downscaled by the browser, but allow full-size ones too).
    client_max_body_size 12m;
}

# Keycloak's admin console is not served through the app: use http://localhost:8180/auth/admin/
# on the Mac itself.
location /auth/admin/ {
    return 403;
}

location /auth/ {
    proxy_pass $keycloak;
    # Keycloak's responses carry large cookies.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

location / {
    try_files $uri /index.html;
}
