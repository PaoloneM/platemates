# Serves the built SPA and forwards API/auth/admin traffic to Django, keeping a single origin so
# that session cookies and CSRF behave as in development.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the backend through Docker's DNS on every request: with a static `proxy_pass` host,
    # nginx keeps the IP from its start and breaks whenever the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location ~ ^/(api|oidc|admin|static)/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Menu generation waits on the LLM.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
